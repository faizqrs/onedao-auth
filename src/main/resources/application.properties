spring.application.name=onedao-auth
server.port=8080

# ---- PostgreSQL (change password!) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/onedao_db
spring.datasource.username=postgres
spring.datasource.password=[PASTE YOUR DB PASSWORD]
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:ChangeThisSecretToAtLeast32CharactersLong_OneDAO2026}
app.jwt.expiration-ms=3600000

# ---- Business rules ----
app.blocked-countries=SY,AF,IR,KP
app.otp.required=false
app.otp.expiry-minutes=5

springdoc.swagger-ui.path=/swagger-ui.html
